            margin: 0;
            overflow: hidden; /* Prevents scrollbars */
            font-family: 'Courier New', Courier, monospace;
            user-select: none;

        .bouquet-container {
            position: relative;
            width: 500px;
            height: 520px;
            display: flex;
            justify-content: center;
            transform-origin: center center;
            /* This line makes it responsive to your phone screen size */

        .bg-dark-red    { background-color: #540505; }
        .bg-mid-red     { background-color: #9c0e0e; }
        .bg-bright-red  { background-color: #d61a1a; }
        .bg-deep-green  { background-color: #213d19; }
        .bg-main-green  { background-color: #3b662e; }
        .bg-light-green { background-color: #528543; }
        .bg-pink-main   { background-color: #e5829d; }
        .bg-pink-deep   { background-color: #ba5673; }

        .canopy-deep  { left: 60px; top: 40px; width: 380px; height: 160px; border-radius: 60px; }
        .canopy-mid   { left: 30px; top: 60px; width: 440px; height: 120px; border-radius: 30px; }
        .canopy-main  { left: 100px; top: 25px; width: 300px; height: 180px; border-radius: 70px; }
        .canopy-high  { left: 140px; top: 15px; width: 220px; height: 40px; border-radius: 15px; }

        .wrap-cuff { left: 135px; top: 190px; width: 230px; height: 20px; border-radius: 4px; z-index: 5; }
        .wrap-cone-container { position: absolute; left: 135px; top: 210px; width: 0; height: 0; border-left: 115px solid transparent; border-right: 115px solid transparent; border-top: 175px solid #e5829d; z-index: 4; }
        .wrap-cone-shadow { position: absolute; left: 135px; top: 210px; width: 0; height: 0; border-left: 115px solid transparent; border-right: 0px solid transparent; border-top: 175px solid #ba5673; z-index: 3; }
        .stem-bundle { left: 234px; top: 375px; width: 32px; height: 45px; border-radius: 3px; z-index: 1; }

        /* --- ROSES (Unchanged) --- */
        .rose { width: 34px; height: 34px; border-radius: 4px; z-index: 10; }
        .rose-mid { margin: 4px; width: 26px; height: 26px; border-radius: 2px; }
        .rose-core { margin: 4px; width: 18px; height: 18px; }

        /* Positions */
        .r1 { left: 233px; top: 10px; } .r2 { left: 165px; top: 35px; } .r3 { left: 301px; top: 35px; }
        .r4 { left: 100px; top: 60px; } .r5 { left: 366px; top: 60px; } .r6 { left: 233px; top: 65px; }
        .r7 { left: 170px; top: 85px; } .r8 { left: 296px; top: 85px; } .r9 { left: 95px; top: 110px; }
        .r10 { left: 371px; top: 110px; } .r11 { left: 233px; top: 120px; } .r12 { left: 155px; top: 145px; }
        .r13 { left: 311px; top: 145px; } .r14 { left: 80px; top: 160px; } .r15 { left: 386px; top: 160px; }
        .r16 { left: 120px; top: 180px; } .r17 { left: 346px; top: 180px; } .r18 { left: 233px; top: 175px; }
        .r19 { left: 185px; top: 160px; } .r20 { left: 281px; top: 160px; } .r21 { left: 233px; top: 100px; }

        .bb { width: 6px; height: 6px; background-color: #ffffff; z-index: 11; border-radius: 1px; }

        /* --- CARD --- */
        .card-string { position: absolute; left: 335px; top: 205px; width: 2px; height: 30px; background-color: #4a3b32; z-index: 7; }
        .card-system { position: absolute; left: 310px; top: 230px; width: 75px; height: 65px; cursor: pointer; z-index: 20; perspective: 1000px; }
        .card-dual-face { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background-color: #fcfbe3; border: 2px solid #e0dbb6; border-radius: 4px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .heart { width: 24px; height: 20px; background-color: #d62222; position: relative; transform: rotate(-45deg); }
        .heart:before, .heart:after { content: ""; width: 24px; height: 24px; background-color: #d62222; border-radius: 50%; position: absolute; }
        .heart:before { top: -12px; left: 0; } .heart:after { top: 0; left: 12px; }
        .card-back { transform: rotateY(180deg); background-color: #fffdec; padding: 6px; text-align: center; }
        .card-back p { color: #31231a; font-size: 8px; line-height: 11px; margin: 0; font-weight: bold; }
        
        /* Fixed card expansion for mobile */
        .card-system.open .card-dual-face { 
            transform: rotateY(180deg) scale(2.2) translateX(-5px) !important; 
            z-index: 999; 
        }
    </style>
