<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetrical Pixel Cone Bouquet (Broad Spread)</title>
    <style>
        /* Centers everything cleanly on the black screen */
        body {
            background-color: #0c0c0c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        /* Expanded container box for broader layout sizing */
        .bouquet-container {
            position: relative;
            width: 500px; /* Increased from 400 */
            height: 520px;
            display: flex;
            justify-content: center;
        }

        .pixel {
            position: absolute;
            box-sizing: border-box;
        }

        /* --- THE COLOR PALETTE --- */
        .bg-dark-red    { background-color: #540505; }
        .bg-mid-red     { background-color: #9c0e0e; }
        .bg-bright-red  { background-color: #d61a1a; }
        .bg-deep-green  { background-color: #213d19; }
        .bg-main-green  { background-color: #3b662e; }
        .bg-light-green { background-color: #528543; }
        .bg-white       { background-color: #ffffff; }
        .bg-pink-main   { background-color: #e5829d; }
        .bg-pink-deep   { background-color: #ba5673; }

        /* --- EXPANDED GREEN CANOPY BACKGROUND --- */
        /* Increased widths and adjusted horizontal positions for a broader canvas */
        .canopy-deep  { left: 60px;  top: 40px;  width: 380px; height: 160px; border-radius: 60px; } /* Wider */
        .canopy-mid   { left: 30px;  top: 60px;  width: 440px; height: 120px; border-radius: 30px; } /* Much Wider */
        .canopy-main  { left: 100px; top: 25px;  width: 300px; height: 180px; border-radius: 70px; } /* Wider & Deeper */
        .canopy-high  { left: 140px; top: 15px;  width: 220px; height: 40px;  border-radius: 15px; } /* Higher & Wider */

        /* --- SOLID CSS BORDER CONE SHAPE (Centered) --- */
        .wrap-cuff { 
            left: 135px; /* Re-centered for the wider container */
            top: 190px; 
            width: 230px; 
            height: 20px;  
            border-radius: 4px; 
            z-index: 5; 
        }
        
        /* Centered cone shape */
        .wrap-cone-container {
            position: absolute;
            left: 135px; /* Re-centered */
            top: 210px;
            width: 0;
            height: 0;
            border-left: 115px solid transparent;
            border-right: 115px solid transparent;
            border-top: 175px solid #e5829d; /* bg-pink-main */
            z-index: 4;
        }

        /* Centered shadow for depth */
        .wrap-cone-shadow {
            position: absolute;
            left: 135px; /* Re-centered */
            top: 210px;
            width: 0;
            height: 0;
            border-left: 115px solid transparent;
            border-right: 0px solid transparent;
            border-top: 175px solid #ba5673; /* bg-pink-deep */
            z-index: 3;
        }

        /* --- BOTTOM PROTRUDING STEMS (Centered) --- */
        .stem-bundle  { left: 234px; top: 375px; width: 32px;  height: 45px; border-radius: 3px; z-index: 1; }

        /* --- THE ROSES: DISTRIBUTED EVENLY --- */
        .rose         { width: 34px; height: 34px; border-radius: 4px; z-index: 10; }
        .rose-mid     { margin: 4px; width: 26px; height: 26px; border-radius: 2px; }
        .rose-core    { margin: 4px; width: 18px; height: 18px; }

        /* New symmetric, broadly spread coordinates for all 21 roses */
        /* Row 1 (Highest Arch) */
        .r1  { left: 233px; top: 10px;  } /* Centered Peak */
        
        /* Row 2 (Mid-High Arch) */
        .r2  { left: 165px; top: 35px;  }
        .r3  { left: 301px; top: 35px;  }
        .r4  { left: 100px; top: 60px;  } /* Wider spread */
        .r5  { left: 366px; top: 60px;  }

        /* Row 3 (Main Middle Distribution) */
        .r6  { left: 233px; top: 65px;  } /* Central row */
        .r7  { left: 170px; top: 85px;  }
        .r8  { left: 296px; top: 85px;  }
        .r9  { left: 95px;  top: 110px; } /* Wide row */
        .r10 { left: 371px; top: 110px; }
        .r11 { left: 233px; top: 120px; } /* Lower center peak */

        /* Row 4 (Lower Broad Arch) */
        .r12 { left: 155px; top: 145px; }
        .r13 { left: 311px; top: 145px; }
        .r14 { left: 80px;  top: 160px; } /* Lowest extreme wide */
        .r15 { left: 386px; top: 160px; }

        /* Row 5 (Lowest Distribution) */
        .r16 { left: 120px; top: 180px; }
        .r17 { left: 346px; top: 180px; }
        .r18 { left: 233px; top: 175px; } /* Lower central foundation */
        .r19 { left: 185px; top: 160px; }
        .r20 { left: 281px; top: 160px; }
        .r21 { left: 233px; top: 100px; } /* Mid-low center */

        /* --- SPREAD WHITE BABY'S BREATH --- */
        .bb { width: 6px; height: 6px; background-color: #ffffff; z-index: 11; border-radius: 1px; }
        /* Redistributed coordinates to follow the broader arch */
        .bb-1  { left: 95px;  top: 45px;  } .bb-2  { left: 135px; top: 20px;  }
        .bb-3  { left: 365px; top: 20px;  } .bb-4  { left: 405px; top: 45px;  }
        .bb-5  { left: 55px;  top: 120px; } .bb-6  { left: 445px; top: 120px; }
        .bb-7  { left: 190px; top: 5px;   } .bb-8  { left: 275px; top: 5px;   }
        .bb-9  { left: 135px; top: 180px; } .bb-10 { left: 365px; top: 180px; }

        /* --- INTERACTIVE CARD SYSTEM (Re-centered) --- */
        .card-string {
            position: absolute;
            left: 335px; top: 205px; /* Offset horizontally */
            width: 2px; height: 30px;
            background-color: #4a3b32;
            z-index: 7;
        }

        .card-system {
            position: absolute;
            left: 310px; /* Offset horizontally to match string */
            top: 230px;
            width: 75px;
            height: 65px;
            cursor: pointer;
            z-index: 20;
            perspective: 1000px;
        }

        .card-dual-face {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background-color: #fcfbe3;
            border: 2px solid #e0dbb6;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* Pixel heart drawing on front */
        .card-front .heart {
            width: 24px;
            height: 20px;
            background-color: #d62222;
            position: relative;
            transform: rotate(-45deg);
            margin-top: -5px;
        }
        .heart:before, .heart:after {
            content: "";
            width: 24px;
            height: 24px;
            background-color: #d62222;
            border-radius: 50%;
            position: absolute;
        }
        .heart:before { top: -12px; left: 0; }
        .heart:after { top: 0; left: 12px; }

        /* Message board configuration inside */
        .card-back {
            transform: rotateY(180deg);
            background-color: #fffdec;
            padding: 6px;
            text-align: center;
            justify-content: center;
        }

        .card-back p {
            color: #31231a;
            font-size: 8px;
            line-height: 11px;
            margin: 0;
            font-weight: bold;
        }

        /* Active click popup state mechanics (centered in viewport) */
        .card-system.open .card-dual-face {
            transform: rotateY(180deg) scale(2.8) translateX(-10px); /* Center scale */
            z-index: 999;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <div class="bouquet-container">
        <!-- Expanded canopy background -->
        <div class="pixel canopy-deep bg-deep-green"></div>
        <div class="pixel canopy-mid bg-main-green"></div>
        <div class="pixel canopy-main bg-main-green"></div>
        <div class="pixel canopy-high bg-light-green"></div>

        <!-- Central stem bundle -->
        <div class="pixel stem-bundle bg-deep-green"></div>

        <!-- Central pink cone -->
        <div class="pixel wrap-cuff bg-pink-deep"></div>
        <div class="wrap-cone-shadow"></div>
        <div class="wrap-cone-container"></div>

        <!-- Broadly spread 21 Roses (r1 - r21) -->
        <div class="pixel rose r1 bg-dark-red"><div class="rose-mid bg-mid-red"><div class="rose-core bg-bright-red"></div></div></div>
        <div class="pixel rose r2 bg-dark-red"><div class="rose-mid bg-mid-red"><div class="rose-core bg-bright-red"></div></div></div>
        <div class="pixel rose r3 bg-dark-red"><div class="rose-mid bg-mid-red"><div class="rose-core bg-bright-red"></div></div></div>
        <div class="pixel rose r4 bg-dark-red"><div class="rose-mid bg-mid-red"><div class="rose-core bg-bright-red"></div></div></div>
        <div class="pixel rose r5 bg-dark-red"><div class="rose-mid bg-mid-red"><div class="rose-core bg-bright-red"></div></div></div>
        <div class="pixel rose r6 bg-dark-red"><div class="rose-mid bg-mid-red"><div class="rose-core bg-bright-red"></div></div></div>
        <div class="pixel rose r7 bg-dark-red"><div class="rose-mid bg-mid-red"><div class="rose-core bg-bright-red"></div></div></div>
        <div class="pixel rose r8 bg-dark-red"><div class="rose-mid bg-mid-red"><div class="rose-core bg-bright-red"></div></div></div>
        <div class="pixel rose r9 bg-dark-red"><div class="rose-mid bg-mid-red"><div class="rose-core bg-bright-red"></div></div></div>
        <div class="pixel rose r10 bg-dark-red"><div class="rose-mid bg-mid-red"><div class="rose-core bg-bright-red"></div></div></div>
        <div class="pixel rose r11 bg-dark-red"><div class="rose-mid bg-mid-red"><div class="rose-core bg-bright-red"></div></div></div>
        <div class="pixel rose r12 bg-dark-red"><div class="rose-mid bg-mid-red"><div class="rose-core bg-bright-red"></div></div></div>
        <div class="pixel rose r13 bg-dark-red"><div class="rose-mid bg-mid-red"><div class="rose-core bg-bright-red"></div></div></div>
        <div class="pixel rose r14 bg-dark-red"><div class="rose-mid bg-mid-red"><div class="rose-core bg-bright-red"></div></div></div>
        <div class="pixel rose r15 bg-dark-red"><div class="rose-mid bg-mid-red"><div class="rose-core bg-bright-red"></div></div></div>
        <div class="pixel rose r16 bg-dark-red"><div class="rose-mid bg-mid-red"><div class="rose-core bg-bright-red"></div></div></div>
        <div class="pixel rose r17 bg-dark-red"><div class="rose-mid bg-mid-red"><div class="rose-core bg-bright-red"></div></div></div>
        <div class="pixel rose r18 bg-dark-red"><div class="rose-mid bg-mid-red"><div class="rose-core bg-bright-red"></div></div></div>
        <div class="pixel rose r19 bg-dark-red"><div class="rose-mid bg-mid-red"><div class="rose-core bg-bright-red"></div></div></div>
        <div class="pixel rose r20 bg-dark-red"><div class="rose-mid bg-mid-red"><div class="rose-core bg-bright-red"></div></div></div>
        <div class="pixel rose r21 bg-dark-red"><div class="rose-mid bg-mid-red"><div class="rose-core bg-bright-red"></div></div></div>

        <!-- Redistributed Baby's Breath -->
        <div class="pixel bb bb-1"></div><div class="pixel bb bb-2"></div><div class="pixel bb bb-3"></div><div class="pixel bb bb-4"></div><div class="pixel bb bb-5"></div>
        <div class="pixel bb bb-6"></div><div class="pixel bb bb-7"></div><div class="pixel bb bb-8"></div><div class="pixel bb bb-9"></div><div class="pixel bb bb-10"></div>

        <!-- Interactive Card (Re-centered) -->
        <div class="card-string"></div>
        <div class="card-system" id="giftCard">
            <div class="card-dual-face">
                <div class="card-front">
                    <div class="heart red-heart"></div>
                </div>
                <div class="card-back">
                    <p>Thank youu</p>
                    <p>Meri Eshii</p>
                    <p>I lovee youuuu</p>
                    <p>sooooo muchh💗</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Click listener for the 3D flipping animation mechanics
        const card = document.getElementById('giftCard');
        card.addEventListener('click', function() {
            this.classList.toggle('open');
        });
    </script>
</body>
</html>
